<meta charset="utf-8">
<title>API Proposal</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: one reading column; each endpoint is a spec sheet with a fixed label rail (3–7) so every card scans the same way. */
:root {
  --bg: #f6f7f9;
  --surface: #ffffff;
  --sunken: #eef0f4;
  --fg: #1b1f27;
  --muted: #5d6573;
  --rule: #d9dde4;
  --accent: #2f4fbf;
  --add-bg: #e3f4e8;  --add-fg: #1d6b35;
  --del-bg: #fbe5e3;  --del-fg: #a3271c;
  --chg-bg: #fdf0d6;  --chg-fg: #8a5a00;
  --get: #2f6fb5; --post: #1d7a45; --patch: #9a6200; --put: #7a4fb0; --delete: #b0302a;
  --font-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --radius: 6px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #12151b; --surface: #1a1e26; --sunken: #232833; --fg: #e4e7ee; --muted: #9aa2b1; --rule: #2f3542; --accent: #8ea6ff;
    --add-bg: #173323; --add-fg: #7fd69c; --del-bg: #3a1c1a; --del-fg: #ff9a8f; --chg-bg: #3a2e12; --chg-fg: #f2c46b;
    --get: #7fb2ec; --post: #6fcf98; --patch: #f0b75a; --put: #c3a2f0; --delete: #ff8a80;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #12151b; --surface: #1a1e26; --sunken: #232833; --fg: #e4e7ee; --muted: #9aa2b1; --rule: #2f3542; --accent: #8ea6ff;
  --add-bg: #173323; --add-fg: #7fd69c; --del-bg: #3a1c1a; --del-fg: #ff9a8f; --chg-bg: #3a2e12; --chg-fg: #f2c46b;
  --get: #7fb2ec; --post: #6fcf98; --patch: #f0b75a; --put: #c3a2f0; --delete: #ff8a80;
  color-scheme: dark;
}
body { background: var(--bg); color: var(--fg); font: 15px/1.55 var(--font-body); }
main { max-width: 980px; margin: 0 auto; padding-block: 32px 64px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: grid; gap: 28px; }
h1, h2, h3 { text-wrap: balance; margin: 0; line-height: 1.25; }
h1 { font-size: 1.75rem; font-weight: 600; }
h2 { font-size: 1.1rem; font-weight: 600; }
p { margin: 0; max-width: 70ch; }
code, .mono { font-family: var(--font-mono); font-size: 0.88em; }
:not(pre) > code { background: var(--sunken); padding: 0.05em 0.35em; border-radius: 4px; }
a { color: var(--accent); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.eyebrow { font-size: 0.75rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); font-weight: 500; }
.meta { display: flex; flex-wrap: wrap; gap: 6px 16px; color: var(--muted); font-size: 0.85rem; }
header { display: grid; gap: 10px; }
.pill { display: inline-block; font-size: 0.75rem; font-weight: 600; padding: 2px 8px; border-radius: 999px; letter-spacing: 0.02em; white-space: nowrap; }
.pill.status { background: var(--sunken); color: var(--fg); border: 1px solid var(--rule); }
.chip-new, .st-added { background: var(--add-bg); color: var(--add-fg); }
.chip-changed, .st-changed { background: var(--chg-bg); color: var(--chg-fg); }
.chip-removed, .st-removed { background: var(--del-bg); color: var(--del-fg); }

/* Summary */
.summary { display: grid; gap: 14px; }
.counts { display: flex; flex-wrap: wrap; gap: 10px; }
.count { background: var(--surface); border: 1px solid var(--rule); border-radius: var(--radius); padding: 8px 14px; display: grid; min-width: 96px; }
.count b { font-size: 1.4rem; font-variant-numeric: tabular-nums; font-weight: 600; }
.count span { font-size: 0.8rem; color: var(--muted); }
.count.breaking b { color: var(--del-fg); }
.breaklist { background: var(--del-bg); color: var(--del-fg); border-radius: var(--radius); padding: 12px 16px; display: grid; gap: 6px; }
.breaklist ul { margin: 0; padding-left: 1.2em; }
.breaklist a { color: inherit; }

/* Index */
.index { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 0.9rem; }
th { text-align: left; font-weight: 500; color: var(--muted); font-size: 0.78rem; letter-spacing: 0.04em; text-transform: uppercase; padding: 6px 10px; border-bottom: 1px solid var(--rule); }
td { padding: 7px 10px; border-bottom: 1px solid var(--rule); vertical-align: top; }
tr:last-child td { border-bottom: 0; }
.method { font-family: var(--font-mono); font-weight: 500; font-size: 0.78rem; letter-spacing: 0.04em; }
.m-GET { color: var(--get); } .m-POST { color: var(--post); } .m-PATCH { color: var(--patch); } .m-PUT { color: var(--put); } .m-DELETE { color: var(--delete); }

/* Endpoint card */
.endpoint { background: var(--surface); border: 1px solid var(--rule); border-radius: var(--radius); overflow: hidden; scroll-margin-top: 16px; }
.endpoint.is-breaking { border-left: 4px solid var(--del-fg); }
.ep-head { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; padding: 14px 18px; background: var(--sunken); border-bottom: 1px solid var(--rule); }
.ep-head .path { font-family: var(--font-mono); font-size: 1rem; font-weight: 500; word-break: break-all; }
.ep-head .method { font-size: 0.9rem; }
.rows { display: grid; }
.row { display: grid; grid-template-columns: 170px minmax(0, 1fr); gap: 16px; padding: 14px 18px; border-bottom: 1px solid var(--rule); }
.row:last-child { border-bottom: 0; }
.row > .label { font-size: 0.82rem; color: var(--muted); font-weight: 500; }
.row > .label .n { font-family: var(--font-mono); margin-right: 6px; }
.row > .body { min-width: 0; display: grid; gap: 10px; }
.unchanged { color: var(--muted); font-size: 0.85rem; }
details > summary { cursor: pointer; color: var(--muted); font-size: 0.85rem; }
details[open] > summary { margin-bottom: 8px; }
.ba { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.ba > div { min-width: 0; display: grid; gap: 4px; align-content: start; }
.ba .side { font-size: 0.72rem; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); font-weight: 500; }
.was { color: var(--muted); text-decoration: line-through; }
.tables { display: flex; flex-wrap: wrap; gap: 6px; }
.tbl { font-family: var(--font-mono); font-size: 0.82rem; padding: 2px 8px; border-radius: 4px; border: 1px solid var(--rule); }
.tbl.st-same { background: var(--sunken); }
.tbl .acc { color: var(--muted); }
.fields { overflow-x: auto; }
.fields td.name { font-family: var(--font-mono); font-size: 0.85rem; white-space: nowrap; }
.fields td.type { font-family: var(--font-mono); font-size: 0.82rem; }
.fields tr.st-added td, .fields tr.st-changed td, .fields tr.st-removed td { background: transparent; }
.fields tr.st-added { box-shadow: inset 3px 0 var(--add-fg); }
.fields tr.st-changed { box-shadow: inset 3px 0 var(--chg-fg); }
.fields tr.st-removed { box-shadow: inset 3px 0 var(--del-fg); }
.fields tr.st-removed td.name { text-decoration: line-through; }
.mark { font-family: var(--font-mono); font-size: 0.75rem; font-weight: 600; padding: 1px 6px; border-radius: 4px; }
.loc { color: var(--muted); font-size: 0.78rem; }
.req { font-size: 0.78rem; }
.req.opt { color: var(--muted); }
pre.json { margin: 0; background: var(--sunken); border-radius: var(--radius); padding: 10px 12px; overflow-x: auto; font: 0.8rem/1.5 var(--font-mono); }
.reqline { font-family: var(--font-mono); font-size: 0.82rem; }
.errors { margin: 0; padding-left: 1.1em; font-size: 0.88rem; }
.errors code { font-weight: 500; }
.auth { display: grid; gap: 4px; }
.notes { font-size: 0.88rem; color: var(--muted); }
.ep-breaks { background: var(--del-bg); color: var(--del-fg); padding: 10px 18px; font-size: 0.88rem; }
.ep-breaks ul { margin: 4px 0 0; padding-left: 1.2em; }

/* Diagram + questions */
.diagram { display: grid; gap: 10px; }
.diagram pre.mermaid { background: var(--surface); border: 1px solid var(--rule); border-radius: var(--radius); padding: 12px; overflow-x: auto; margin: 0; }
.questions { display: grid; gap: 12px; }
.q { background: var(--surface); border: 1px solid var(--rule); border-radius: var(--radius); padding: 14px 18px; display: grid; gap: 8px; }
.q .qid { font-family: var(--font-mono); color: var(--accent); font-weight: 500; margin-right: 6px; }
.q ol { margin: 0; padding-left: 1.4em; display: grid; gap: 4px; }
.q .ctx { font-size: 0.88rem; color: var(--muted); }
footer { color: var(--muted); font-size: 0.8rem; }

@media (max-width: 640px) {
  .row { grid-template-columns: minmax(0, 1fr); gap: 6px; }
  .ba { grid-template-columns: minmax(0, 1fr); }
}
</style>

<main>
  <header id="header"></header>
  <section class="summary" id="summary"></section>
  __DIAGRAM_SECTION__
  <section id="index"></section>
  <div id="endpoints" style="display:grid;gap:22px"></div>
  <section class="questions" id="questions"></section>
  <footer id="footer"></footer>
</main>

<script id="proposal-data" type="application/json">__PROPOSAL_JSON__</script>
<script>
(() => {
  const P = JSON.parse(document.getElementById("proposal-data").textContent);
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  // Prose fields allow `code` spans and nothing else.
  const md = (s) => esc(s).replace(/`([^`]+)`/g, "<code>$1</code>");
  const $ = (id) => document.getElementById(id);
  const MARK = { added: "+", removed: "−", changed: "~", same: "" };
  const CHANGE_LABEL = { new: "New", changed: "Changed", removed: "Removed" };
  const ROW_LABEL = { purpose: "What it does", tables: "Tables", input: "Input", output: "Output", auth: "Who can call it" };
  const ROW_NUM = { purpose: 3, tables: 4, input: 5, output: 6, auth: 7 };
  const same = (a, b) => JSON.stringify(a ?? null) === JSON.stringify(b ?? null);
  const anchor = (i) => `ep-${i + 1}`;

  document.title = P.title;

  // Header
  const metaBits = [P.repo && `<span class="mono">${esc(P.repo)}</span>`, P.base && `base <span class="mono">${esc(P.base)}</span>`,
    P.date && `<span>${esc(P.date)}</span>`, P.task && `<span>${md(P.task)}</span>`].filter(Boolean);
  $("header").innerHTML = `
    <div class="eyebrow">API proposal${P.status ? ` · <span class="pill status">${esc(P.status)}</span>` : ""}</div>
    <h1>${md(P.title)}</h1>
    ${metaBits.length ? `<div class="meta">${metaBits.join("")}</div>` : ""}
    <p>${md(P.summary)}</p>`;

  // Summary
  const eps = P.endpoints;
  const n = (k) => eps.filter((e) => e.change === k).length;
  const breaking = eps.flatMap((e, i) => e.breaking.map((r) => ({ i, e, r })));
  $("summary").innerHTML = `
    <div class="counts">
      <div class="count"><b>${n("new")}</b><span>new</span></div>
      <div class="count"><b>${n("changed")}</b><span>changed</span></div>
      <div class="count"><b>${n("removed")}</b><span>removed</span></div>
      <div class="count breaking"><b>${breaking.length}</b><span>breaking</span></div>
    </div>
    ${breaking.length ? `<div class="breaklist"><strong>Breaking for existing callers</strong><ul>${breaking.map(({ i, e, r }) =>
      `<li><a href="#${anchor(i)}"><span class="mono">${esc(e.method)} ${esc(e.path)}</span></a>: ${md(r)}</li>`).join("")}</ul></div>` : ""}`;

  // Index
  $("index").innerHTML = `<h2 style="margin-bottom:8px">Endpoints</h2><div class="index"><table>
    <thead><tr><th>Method</th><th>Path</th><th>Change</th><th>Permission</th></tr></thead><tbody>
    ${eps.map((e, i) => {
      const side = e.after || e.before;
      return `<tr><td><span class="method m-${esc(e.method)}">${esc(e.method)}</span></td>
        <td><a class="mono" href="#${anchor(i)}">${esc(e.path)}</a></td>
        <td><span class="pill chip-${esc(e.change)}">${CHANGE_LABEL[e.change]}</span>${e.breaking.length ? ` <span class="pill chip-removed">breaking</span>` : ""}</td>
        <td class="mono">${esc(side?.auth?.permission ?? "")}</td></tr>`;
    }).join("")}</tbody></table></div>`;

  // Section renderers. Each takes one side's section value.
  const tablesHtml = (rows) => `<div class="tables">${rows.map((t) =>
    `<span class="tbl st-${t.status || "same"}">${t.status && t.status !== "same" ? `<span class="mark">${MARK[t.status]}</span>` : ""}${esc(t.table)} <span class="acc">${esc(t.access)}</span></span>`).join("")}</div>`;

  const fieldsTable = (rows, { diff }) => {
    if (!rows.length) return `<span class="unchanged">None</span>`;
    return `<div class="fields"><table><thead><tr>${diff ? "<th></th>" : ""}<th>Field</th><th>Type</th><th>Required</th><th>Notes</th></tr></thead><tbody>
      ${rows.map((r) => {
        const f = r.after || r.before || r;
        const old = r.before;
        const st = r.status || "same";
        const typeCell = st === "changed" && old && old.type !== f.type ? `<span class="was">${esc(old.type)}</span> → ${esc(f.type)}` : esc(f.type);
        const req = (x) => x.required ? `<span class="req">required</span>` : `<span class="req opt">optional</span>`;
        const reqCell = st === "changed" && old && old.required !== f.required ? `<span class="was">${old.required ? "required" : "optional"}</span> → ${req(f)}` : req(f);
        const notes = st === "changed" && old && old.notes !== f.notes && old.notes ? `${md(f.notes)}<div class="was">${md(old.notes)}</div>` : md(f.notes);
        return `<tr class="st-${st}">${diff ? `<td>${MARK[st] ? `<span class="mark st-${st}">${MARK[st]}</span>` : ""}</td>` : ""}
          <td class="name">${esc(f.name)}${f.in ? ` <span class="loc">${esc(f.in)}</span>` : ""}</td>
          <td class="type">${typeCell}</td><td>${reqCell}</td><td>${notes}</td></tr>`;
      }).join("")}</tbody></table></div>`;
  };

  const jsonBlock = (v) => `<pre class="json">${esc(typeof v === "string" ? v : JSON.stringify(v, null, 2))}</pre>`;
  const requestExample = (ex) => !ex ? "" :
    `<div class="reqline">${esc(ex.request)}</div>${ex.body !== undefined ? jsonBlock(ex.body) : ""}`;
  const responseExample = (ex) => ex === undefined ? "" : jsonBlock(ex);
  const errorsHtml = (errs) => !errs?.length ? "" :
    `<ul class="errors">${errs.map((x) => `<li><code>${esc(x.status)}</code> ${md(x.when)}</li>`).join("")}</ul>`;
  const authHtml = (a) => !a ? "" : `<div class="auth"><div><code>${esc(a.permission)}</code></div><div>${md(a.who)}</div>${a.notes ? `<div class="notes">${md(a.notes)}</div>` : ""}</div>`;

  const exampleDetails = (label, inner) => inner ? `<details open><summary>${label}</summary>${inner}</details>` : "";
  const baPair = (b, a) => `<div class="ba"><div><span class="side">Now</span>${b || '<span class="unchanged">—</span>'}</div><div><span class="side">Proposed</span>${a || '<span class="unchanged">—</span>'}</div></div>`;

  const row = (key, body) => `<div class="row"><div class="label"><span class="n">${ROW_NUM[key]}</span>${ROW_LABEL[key]}</div><div class="body">${body}</div></div>`;
  const unchangedRow = (key, body) => row(key, `<details><summary>Unchanged</summary>${body}</details>`);

  // A single side (new or removed endpoints).
  const singleSide = (s) => [
    row("purpose", `<p>${md(s.purpose)}</p>`),
    row("tables", tablesHtml(s.tables || [])),
    row("input", fieldsTable(s.input?.fields || [], { diff: false }) + exampleDetails("Example request", requestExample(s.input?.example))),
    row("output", `<div class="mono">${esc(s.output?.status ?? "")}</div>` + fieldsTable(s.output?.fields || [], { diff: false })
      + exampleDetails("Example response", responseExample(s.output?.example))
      + (s.output?.errors?.length ? exampleDetails("Errors", errorsHtml(s.output.errors)) : "")),
    row("auth", authHtml(s.auth)),
  ].join("");

  // Before/after (changed endpoints): unchanged rows fold away.
  const changedSides = (e) => {
    const b = e.before, a = e.after, d = e.diff;
    const out = [];
    out.push(same(b.purpose, a.purpose) ? unchangedRow("purpose", `<p>${md(a.purpose)}</p>`)
      : row("purpose", `<p class="was">${md(b.purpose)}</p><p>${md(a.purpose)}</p>`));
    const tablesMoved = d.tables.some((t) => t.status !== "same");
    out.push(tablesMoved ? row("tables", tablesHtml(d.tables)) : unchangedRow("tables", tablesHtml(d.tables)));

    const inMoved = d.input.some((r) => r.status !== "same") || !same(b.input?.example, a.input?.example);
    const inBody = fieldsTable(d.input, { diff: true })
      + exampleDetails("Example request", same(b.input?.example, a.input?.example) ? requestExample(a.input?.example)
        : baPair(requestExample(b.input?.example), requestExample(a.input?.example)));
    out.push(inMoved ? row("input", inBody) : unchangedRow("input", inBody));

    const outMoved = d.output.some((r) => r.status !== "same") || !same(b.output?.example, a.output?.example)
      || !same(b.output?.errors, a.output?.errors) || b.output?.status !== a.output?.status;
    const statusLine = b.output?.status !== a.output?.status
      ? `<div class="mono"><span class="was">${esc(b.output?.status)}</span> → ${esc(a.output?.status)}</div>` : `<div class="mono">${esc(a.output?.status ?? "")}</div>`;
    const outBody = statusLine + fieldsTable(d.output, { diff: true })
      + exampleDetails("Example response", same(b.output?.example, a.output?.example) ? responseExample(a.output?.example)
        : baPair(responseExample(b.output?.example), responseExample(a.output?.example)))
      + ((b.output?.errors?.length || a.output?.errors?.length) ? exampleDetails("Errors", same(b.output?.errors, a.output?.errors)
        ? errorsHtml(a.output?.errors) : baPair(errorsHtml(b.output?.errors), errorsHtml(a.output?.errors))) : "");
    out.push(outMoved ? row("output", outBody) : unchangedRow("output", outBody));

    out.push(same(b.auth, a.auth) ? unchangedRow("auth", authHtml(a.auth)) : row("auth", baPair(authHtml(b.auth), authHtml(a.auth))));
    return out.join("");
  };

  $("endpoints").innerHTML = eps.map((e, i) => `
    <article class="endpoint${e.breaking.length ? " is-breaking" : ""}" id="${anchor(i)}">
      <div class="ep-head">
        <span class="method m-${esc(e.method)}">${esc(e.method)}</span>
        <span class="path">${esc(e.path)}</span>
        <span class="pill chip-${esc(e.change)}">${CHANGE_LABEL[e.change]}</span>
      </div>
      ${e.breaking.length ? `<div class="ep-breaks"><strong>Breaks existing callers</strong><ul>${e.breaking.map((r) => `<li>${md(r)}</li>`).join("")}</ul></div>` : ""}
      <div class="rows">${e.change === "changed" ? changedSides(e) : singleSide(e.after || e.before)}</div>
    </article>`).join("");

  // Open questions: options listed, never ranked.
  const qs = P.questions || [];
  $("questions").innerHTML = qs.length ? `<h2>Open questions</h2>${qs.map((q) => `
    <div class="q"><div><span class="qid">${esc(q.id)}</span>${md(q.question)}</div>
      ${q.context ? `<div class="ctx">${md(q.context)}</div>` : ""}
      ${q.options?.length ? `<ol type="a">${q.options.map((o) => `<li>${md(o)}</li>`).join("")}</ol>` : ""}</div>`).join("")}` : "";

  $("footer").innerHTML = `Fields 1–2 are each card's header. Field lists, change markers and breaking flags are computed from the proposal by the renderer; prose (what it does, tables, who can call it) is the author's reading.`;
})();
</script>
